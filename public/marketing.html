<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Videos</title>
    <style>
      body { margin: 0; background: #0b1c12; color: #eef6ef; font-family: sans-serif; }
      main { max-width: 420px; margin: 0 auto; padding: 20px 16px 40px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #b7c4bb; font-size: 14px; }
      video { width: 100%; border-radius: 12px; background: #000; margin-top: 8px; }
      section { margin-top: 28px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Para mandar</h1>
      <p>Tocá el video. Si no sale solo, tocá el triángulo.</p>
      <section>
        <h2>La formación</h2>
        <video controls playsinline preload="metadata" src="/marketing/formacion.mp4"></video>
      </section>
      <section>
        <h2>Quién va</h2>
        <video controls playsinline preload="metadata" src="/marketing/quien-va.mp4"></video>
      </section>
    </main>
  </body>
</html>

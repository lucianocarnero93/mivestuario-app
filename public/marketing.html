<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Videos</title>
    <style>
      body { margin: 0; background: #0b1c12; color: #eef6ef; font-family: sans-serif; }
      main { max-width: 420px; margin: 0 auto; padding: 20px 16px 40px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #b7c4bb; font-size: 14px; }
      video { width: 100%; border-radius: 12px; background: #000; margin-top: 8px; }
      section { margin-top: 28px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Para mandar</h1>
      <p>Subí el volumen. El texto también está en el video. Tocá el triángulo si no sale solo.</p>
      <section>
        <h2>Qué es</h2>
        <p>El grupo queda para hablar. La app es el vestuario.</p>
        <video controls playsinline preload="metadata" src="/marketing/que-es.mp4"></video>
      </section>
      <section>
        <h2>Cómo se usa</h2>
        <p>El DT convoca, el jugador dice si va, y todos ven la formación.</p>
        <video controls playsinline preload="metadata" src="/marketing/como-se-usa.mp4"></video>
      </section>
    </main>
  </body>
</html>

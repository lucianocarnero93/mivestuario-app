<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- FOTO DE EJEMPLO: no es una persona real. Simula una foto cuadrada subida desde el celular (fondo de cancha, contraluz). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20362c"/><stop offset=".48" stop-color="#2f5240"/><stop offset=".62" stop-color="#3f7a4c"/><stop offset="1" stop-color="#2d6238"/>
    </linearGradient>
    <radialGradient id="flood" cx=".82" cy=".1" r=".6"><stop offset="0" stop-color="#fff6d8" stop-opacity=".75"/><stop offset=".35" stop-color="#fff6d8" stop-opacity=".18"/><stop offset="1" stop-color="#fff6d8" stop-opacity="0"/></radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3c4a44"/><stop offset="1" stop-color="#1c2622"/></linearGradient>
    <radialGradient id="face" cx=".62" cy=".3" r=".8"><stop offset="0" stop-color="#6a6560"/><stop offset=".6" stop-color="#3b3936"/><stop offset="1" stop-color="#262523"/></radialGradient>
    <linearGradient id="jersey" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a8a4e"/><stop offset=".55" stop-color="#1a5c34"/><stop offset="1" stop-color="#0f3a21"/></linearGradient>
    <filter id="blur18" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .09 0"/></filter>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- tribuna y alambrado fuera de foco -->
  <g filter="url(#blur6)" opacity=".55">
    <rect x="-10" y="150" width="540" height="90" fill="#1a2c24"/>
    <path d="M-10 236 H 530" stroke="#9fb7a8" stroke-width="3" opacity=".4"/>
    <g stroke="#9fb7a8" stroke-width="2" opacity=".25"><path d="M0 150 L 60 240 M60 150 L 120 240 M120 150 L 180 240 M180 150 L 240 240 M240 150 L 300 240 M300 150 L 360 240 M360 150 L 420 240 M420 150 L 480 240 M480 150 L 540 240"/></g>
  </g>
  <rect width="512" height="512" fill="url(#flood)"/>
  <g filter="url(#blur18)">
    <circle cx="420" cy="70" r="34" fill="#fffbe8" opacity=".55"/><circle cx="350" cy="110" r="20" fill="#fffbe8" opacity=".25"/>
    <circle cx="70" cy="120" r="26" fill="#d9f2c0" opacity=".18"/><circle cx="470" cy="190" r="24" fill="#d9f2c0" opacity=".16"/>
  </g>
  <!-- persona genérica a contraluz (sin rasgos) -->
  <g>
    <path d="M60 512 C 66 418 128 372 206 360 L 306 360 C 384 372 446 418 452 512 Z" fill="url(#jersey)"/>
    <path d="M206 360 C 222 384 290 384 306 360 L 296 352 C 280 368 232 368 216 352 Z" fill="#0c2a18" opacity=".8"/>
    <path d="M212 300 L 212 366 C 236 380 276 380 300 366 L 300 300 Z" fill="#33312e"/>
    <ellipse cx="177" cy="244" rx="12" ry="22" fill="#2c2a28"/><ellipse cx="335" cy="244" rx="12" ry="22" fill="#45423e"/><ellipse cx="256" cy="236" rx="80" ry="96" fill="url(#face)"/>
    <path d="M174 214 C 168 150 206 120 258 120 C 312 120 346 156 338 216 C 330 188 312 170 292 166 C 266 176 220 178 196 172 C 184 182 178 196 174 214 Z" fill="#1d1a18"/>
    <ellipse cx="256" cy="236" rx="80" ry="96" fill="none" stroke="#fff3cf" stroke-width="5" opacity=".35" filter="url(#blur2)" stroke-dasharray="190 400" stroke-dashoffset="-380"/>
  </g>
  <rect width="512" height="512" filter="url(#grain)"/>
</svg>

<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Mi Vestuario · probador de avatar</title>
<!-- Abrir en el navegador (file://). Usa ../avatar.js, el mismo código que arma los PNG. Sirve para revisar combinaciones. -->
<style>
body{margin:0;background:#0b1c12;color:#eef6ef;font-family:Figtree,system-ui,sans-serif;display:flex;gap:32px;padding:32px;flex-wrap:wrap}
#av svg{width:360px;height:360px;border-radius:50%;box-shadow:0 0 0 6px #132a1c}
form{display:grid;grid-template-columns:130px 220px;gap:10px 14px;align-content:start}
label{color:#9bb5a4;font-size:14px;align-self:center}
select,input{background:#132a1c;color:#eef6ef;border:1px solid #234833;border-radius:10px;padding:8px;font:inherit}
pre{background:#132a1c;border:1px solid #234833;border-radius:12px;padding:14px;font-size:13px;width:360px;white-space:pre-wrap}
button{background:#b8f25a;color:#0c1a10;border:0;border-radius:12px;padding:10px;font:700 15px Figtree;grid-column:1/3}
</style>
</head>
<body>
<div><div id="av"></div><pre id="json"></pre></div>
<form id="f"></form>
<script src="../avatar.js"></script>
<script>
var A = window.MVAvatar, f = document.getElementById("f");
var fields = [["skin", Object.keys(A.SKINS)], ["hair", A.HAIRS], ["hairColor", Object.keys(A.HAIR_COLORS)], ["facial", A.FACIALS],
  ["shirtPattern", A.PATTERNS], ["collar", A.COLLARS]];
fields.forEach(function (fd) {
  f.insertAdjacentHTML("beforeend", '<label>' + fd[0] + '</label><select name="' + fd[0] + '">' +
    fd[1].map(function (o) { return '<option>' + o + '</option>'; }).join("") + '</select>');
});
A.EXTRAS.forEach(function (e) { f.insertAdjacentHTML("beforeend", '<label>' + e + '</label><input type="checkbox" name="x-' + e + '">'); });
f.insertAdjacentHTML("beforeend", '<label>primario</label><input type="color" name="primary" value="#1f6f3f"><label>secundario</label><input type="color" name="secondary" value="#b8f25a"><button type="button" id="r">Al azar</button>');
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function draw() {
  var cfg = { v: 1, extras: [] };
  fields.forEach(function (fd) { cfg[fd[0]] = f.elements[fd[0]].value; });
  A.EXTRAS.forEach(function (e) { if (f.elements["x-" + e].checked) cfg.extras.push(e); });
  var team = { primary: f.elements.primary.value, secondary: f.elements.secondary.value };
  document.getElementById("av").innerHTML = A.svg(cfg, team, { bg: A.mix(team.secondary, "#0b1c12", 0.74), uid: "p" });
  document.getElementById("json").textContent = JSON.stringify(cfg, null, 2);
}
f.addEventListener("input", draw);
document.getElementById("r").onclick = function () {
  fields.forEach(function (fd) { if (fd[0] !== "shirtPattern" && fd[0] !== "collar") f.elements[fd[0]].value = pick(fd[1]); });
  draw();
};
f.elements.skin.value = "t4"; f.elements.hair.value = "colita"; draw();
</script>
</body>
</html>

<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Mi Vestuario · Alineación · WhatsApp 1080x1350</title>
<!-- Template "Alineación para compartir" · whatsapp 1080x1350. Reemplazar {{...}}. Ver SPEC.md § Alineación para compartir -->
<link rel="stylesheet" href="alineacion.css">
</head>
<body class="fmt-whatsapp">
<div class="stage">
  <div class="bg"></div>
  <div class="pitch-holder"></div>
  <header class="head key">
    <div class="crest" data-escudo="{{TIENE_ESCUDO}}"><div class="crest-shape">{{EQUIPO_INICIALES}}</div><img src="{{ESCUDO_SRC}}" alt=""></div>
    <div class="titles">
      <div class="kicker">{{KICKER}}</div>
      <div class="team"><span class="fit" data-min="46">{{EQUIPO}}</span></div>
      <div class="rival"><span class="fit" data-min="32"><em>vs</em> {{RIVAL}}</span></div>
      <div class="meta"><span class="fit" data-min="20"><b>{{FECHA}} · {{HORA}}</b> · {{CANCHA}}</span></div>
    </div>
    <div class="badge"><b>{{FORMATO}}</b><span>{{ESQUEMA}}</span></div>
  </header>
  <div class="players"></div>
  <section class="banco key">
    <div class="col-banco"><h3>Banco</h3><div class="banco-lista"></div></div>
    <div class="col-dt"><h3>DT</h3><div class="dt-lista"></div></div>
  </section>
  <footer class="marca key"><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-label="Mi Vestuario"><rect width="32" height="32" rx="7" fill="#0b1c12"/><rect x="4" y="6" width="10" height="20" rx="2" fill="#b8f25a"/><rect x="18" y="6" width="10" height="20" rx="2" fill="#b8f25a"/><rect x="6" y="8" width="6" height="2" rx="1" fill="#0b1c12"/><rect x="6" y="12" width="6" height="2" rx="1" fill="#0b1c12"/><rect x="20" y="8" width="6" height="2" rx="1" fill="#0b1c12"/><rect x="20" y="12" width="6" height="2" rx="1" fill="#0b1c12"/><circle cx="12" cy="22" r="1.5" fill="#0b1c12"/><circle cx="20" cy="22" r="1.5" fill="#0b1c12"/><circle cx="16" cy="16" r="6" fill="#0b1c12"/><circle cx="16" cy="16" r="5.2" fill="#eef6ef"/><polygon fill="#0b1c12" points="16,12.85 19,15.03 17.85,18.55 14.15,18.55 13,15.03"/></svg><span>Armado en <b>Mi Vestuario</b> · <em>mivestuario.com.ar</em></span></footer>
</div>
<script id="datos" type="application/json">{{DATOS_JSON}}</script>
<script src="../avatar/avatar.js"></script>
<script src="alineacion.js"></script>
<script>document.fonts.ready.then(function () { MVAlineacion.render(JSON.parse(document.getElementById("datos").textContent)); });</script>
</body>
</html>

<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Mi Vestuario · Valla invicta</title>
<!-- Template: Valla invicta · tier hielo · 720x1000. Reemplazar {{...}}. Ver SPEC.md -->
<link rel="stylesheet" href="cards.css">
</head>
<body class="solo-card">
<div class="card tier-hielo" data-foto="{{TIENE_FOTO}}" data-escudo="{{TIENE_ESCUDO}}">
  <div class="shape frame"></div>
  <div class="shape body">
    
    <div class="foto">
      <img src="{{FOTO_SRC}}" alt="">
      <div class="fallback"><svg viewBox="0 0 400 490" xmlns="http://www.w3.org/2000/svg"><circle cx="200" cy="150" r="92"/><path d="M20 490 C 26 360 96 290 200 288 C 304 290 374 360 380 490 Z"/></svg><div class="ini">{{INICIALES}}</div></div>
    </div>
    <div class="shine-top"></div>
    <div class="shine"></div>
  </div>
  <svg class="trim" viewBox="0 0 720 1000"><path d="M 56 24 H 252 L 280 46 H 440 L 468 24 H 664 Q 696 24 696 56 V 792 Q 696 842 648 866 L 390 968 Q 360 980 330 968 L 72 866 Q 24 842 24 792 V 56 Q 24 24 56 24 Z"/></svg>
  <div class="col">
    <div class="big" data-fit data-min="96">{{STAT}}</div>
    <div class="big-label">Goles en contra</div>
    <div class="puesto">{{PUESTO}}</div>
    <div class="dorsal">{{DORSAL}}</div>
    <div class="sep"></div>
    <div class="crest"><div class="crest-shape">{{EQUIPO_INICIALES}}</div><img src="{{ESCUDO_SRC}}" alt=""></div>
  </div>
  
  <div class="ribbon" data-fit data-min="26">VALLA INVICTA</div>
  <div class="contexto">vs. {{RIVAL}} · {{FECHA}}</div>
  <div class="nombre" data-fit data-min="56">{{NOMBRE}}</div>
  <div class="equipo">{{EQUIPO}}</div>
  <div class="stats"><div><b>{{RESULTADO}}</b><span>Result.</span></div><div><b>{{VALLAS_TORNEO}}</b><span>Vallas</span></div><div><b>{{PJ_ARCO}}</b><span>PJ arco</span></div></div>
  <div class="marca"><svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-label="Mi Vestuario"><rect width="32" height="32" rx="7" fill="#0b1c12"/><rect x="4" y="6" width="10" height="20" rx="2" fill="#b8f25a"/><rect x="18" y="6" width="10" height="20" rx="2" fill="#b8f25a"/><rect x="6" y="8" width="6" height="2" rx="1" fill="#0b1c12"/><rect x="6" y="12" width="6" height="2" rx="1" fill="#0b1c12"/><rect x="20" y="8" width="6" height="2" rx="1" fill="#0b1c12"/><rect x="20" y="12" width="6" height="2" rx="1" fill="#0b1c12"/><circle cx="12" cy="22" r="1.5" fill="#0b1c12"/><circle cx="20" cy="22" r="1.5" fill="#0b1c12"/><circle cx="16" cy="16" r="6" fill="#0b1c12"/><circle cx="16" cy="16" r="5.2" fill="#eef6ef"/><polygon fill="#0b1c12" points="16,12.85 19,15.03 17.85,18.55 14.15,18.55 13,15.03"/></svg><span>Mi Vestuario</span></div>
</div>
<script>
document.querySelectorAll('[data-fit]').forEach(function (el) {
  var size = parseFloat(getComputedStyle(el).fontSize), min = parseFloat(el.dataset.min || 40);
  while (el.scrollWidth > el.clientWidth + 1 && size > min) { size -= 2; el.style.fontSize = size + 'px'; }
});
</script>
</body>
</html>
